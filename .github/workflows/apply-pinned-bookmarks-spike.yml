name: Apply pinned bookmarks mirror spike

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pinned-bookmarks-spike
  cancel-in-progress: true

jobs:
  apply-spike:
    if: github.repository == 'ClaudioSobrinho/zen'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage installer outside the worktree
        run: |
          cat .github/spike/parts/part-* > /tmp/ZenPinnedBookmarksMirror.mjs.gz.b64
          cp .github/spike/apply.py /tmp/apply-pinned-bookmarks-spike.py

      - name: Check out development snapshot
        run: |
          git fetch origin dev
          git checkout -B spike/pinned-bookmarks-mirror origin/dev

      - name: Install spike files
        run: |
          python3 /tmp/apply-pinned-bookmarks-spike.py /tmp/ZenPinnedBookmarksMirror.mjs.gz.b64

      - name: Verify spike
        run: |
          set -euo pipefail
          test "$(sha256sum src/zen/tabs/ZenPinnedBookmarksMirror.mjs | cut -d' ' -f1)" = "27bd0f1fefe657f5eba5d9e1eee943a69a77fbfbf8dbb4a773b1a80d4ae2dd50"
          node --check src/zen/tabs/ZenPinnedBookmarksMirror.mjs
          node --check src/zen/common/ZenPreloadedScripts.js
          git diff --check
          grep -q 'ZenPinnedBookmarksMirror.mjs' src/zen/common/ZenPreloadedScripts.js
          grep -q 'ZenPinnedBookmarksMirror.mjs' src/zen/tabs/jar.inc.mn
          grep -q 'zen.bookmarks.mirror-pinned-tabs.enabled' prefs/zen/pinned-bookmarks-mirror.yaml
          git status --short

      - name: Commit and push spike branch
        run: |
          set -euo pipefail
          git config user.name "Claudio Sobrinho"
          git config user.email "8421200+ClaudioSobrinho@users.noreply.github.com"
          git add prefs/zen/pinned-bookmarks-mirror.yaml \
            src/zen/common/ZenPreloadedScripts.js \
            src/zen/tabs/ZenPinnedBookmarksMirror.mjs \
            src/zen/tabs/jar.inc.mn \
            docs/pinned-bookmarks-mirror-spike.md
          if git diff --cached --quiet; then
            echo "Spike branch is already up to date."
            exit 0
          fi
          git commit -m "spike: mirror Zen pins to Firefox bookmarks"
          git push origin HEAD:refs/heads/spike/pinned-bookmarks-mirror --force
